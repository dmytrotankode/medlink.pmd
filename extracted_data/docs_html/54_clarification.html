<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Перелік роз’яснень</title>

<link rel="stylesheet" href="/serve.php?f=css/info-pages">
</head>

<body>
  <div class="wrap">
    <div class="head">


      <div class="toolbar card" style="padding:10px 12px;">
        <div class="search">
          <input id="q" type="text" placeholder="Пошук... по назві, опису або тегах" autocomplete="off" />
        </div>
        <span class="pill"><span id="count">0</span> документи (ів)</span>
      </div>
    </div>

    <div id="list" class="list" aria-live="polite"></div>
    <div id="empty" class="empty" style="display:none;">Нічого не знайдено за вашим запитом.</div>
  </div>

  <script>
    // ====== Налаштування ======
    // Якщо відкривати PDF в модалці (iframe) —  true
    const USE_MODAL = false;

    // Якщо сторінка для різних пакетів — можна підставляти номер з URL ?pkg=stac
    const pkgFromUrl = new URLSearchParams(location.search).get('pkg') || 'stac';

    // База документів (ти просто редагуєш цей список)
    // url: шлях до pdf (може бути абсолютний або через твій serve.php)
    const ITEMS = [
	      {
        id: 1,
        title: "Роз’яснення щодо обліку наданих послуг за пакетом",
        date: "01-04-2026",
        desc: "Роз’яснення щодо обліку наданих послуг в електронній системі охорони здоров’я та критеріїв віднесення випадків надання реабілітаційної допомоги до послуг пакету \"Реабілітаційна допомога дорослим і дітям у амбулаторних умовах\"",
        tags: ["роз'яснення", "реабілітація", "діагноз", "групи АР"],
        url: "/serve.php/info/files/rehab-package/Амбулаторна_реабілітація_роз'яснення_від_01.04.2026.PDF"
      },
      {
        id: 2,
        title: "Правил щодо визначення послуг",
        date: "16-04-2026",
        desc: "Наказа Про затвердження Правил щодо визначення послуг за напрямом реабілітаційної допомоги дорослим і дітям у рамках програми медичних гарантій",
        tags: ["правила CR", "наказ"],
        url: "/serve.php/info/files/rehab-package/Правила_щодо_визначення_послуг_за_напрямом_реабілітаційної_допомоги_дорослим_і_дітям.PDF"
      },
      {
        id: 3,
        title: "Додаток до наказу",
        date: "16-04-2026",
        desc: "",
        tags: ["додаток", "правила", "формула кодування", "таблиця"],
        url: "/serve.php/info/files/rehab-package/Додаток_до_наказу.xlsx"
      },
      {
        id: 4,
        title: "Оновлене роз’яснення щодо обліку наданих послуг за пакетом",
        date: "08-07-2026",
        desc: "",
        tags: ["додаток", "правила", "формула кодування", "таблиця"],
        url: "/serve.php/info/files/rehab-package/Лист_Реабілітація_від_08.07.2026.PDF"
      },
      {
        id: 5,
        title: "Додаток до оновленого роз'яснення",
        date: "08-07-2026",
        desc: "",
        tags: ["додаток", "правила", "формула кодування", "таблиця"],
        url: "/serve.php/info/files/rehab-package/Діагнози_від_08.07.2026.xlsx"
      }
    ];

    // ====== Рендер ======
    const listEl = document.getElementById('list');
    const emptyEl = document.getElementById('empty');
    const countEl = document.getElementById('count');
    const qEl = document.getElementById('q');

    function normalize(s) {
      return (s || "")
        .toLowerCase()
        .replace(/\s+/g, " ")
        .trim();
    }

    function matches(item, query) {
      if (!query) return true;
      const hay = normalize([
        item.title,
        item.desc,
        (item.tags || []).join(" "),
        item.date
      ].join(" "));
      return hay.includes(query);
    }

function openPdf(item) {
  if (!USE_MODAL) {
    window.open(item.url, '_blank', 'noopener');
    return;
  }
}

function downloadPdf(item) {
  const a = document.createElement('a');
  a.href = item.url;
  a.download = '';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

    function render(query) {
      const q = normalize(query);
      const filtered = ITEMS.filter(it => matches(it, q));

      listEl.innerHTML = "";
      countEl.textContent = filtered.length;
      emptyEl.style.display = filtered.length ? "none" : "block";

      filtered.forEach((item, idx) => {
        const el = document.createElement('div');
        el.className = 'item';

        el.innerHTML = `
          <div class="badge">${String(idx+1).padStart(2,'0')}</div>
          <div class="meta">
            <p class="title">${escapeHtml(item.title)}</p>
            <p class="desc">${escapeHtml(item.desc || "")}</p>
            <div class="row">
              <span>📅 ${escapeHtml(item.date || "")}</span>
              <div class="tags">
                ${(item.tags || []).slice(0, 6).map(t => `<span class="tag">${escapeHtml(t)}</span>`).join("")}
              </div>
            </div>
          </div>
          <div class="actions">
            <button class="btn primary" type="button">Завантажити PDF</button>
	  		</div>
			`;

		// Клік на кнопку
        el.querySelector('button')
  			.addEventListener('click', (e) => {
    		e.stopPropagation();
    		downloadPdf(item);
  		});
        
        // Клік на заголовок
        el.querySelector('.title').addEventListener('click', () => openPdf(item));

        listEl.appendChild(el);
      });
    }

    // XSS-safe простий escape
    function escapeHtml(str) {
      return String(str ?? "").replace(/[&<>"']/g, (ch) => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      }[ch]));
    }

    // ====== Події ======
    qEl.addEventListener('input', () => render(qEl.value));
    render("");


</script>
</body>
</html>
